<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Louis — Mobile products and thoughtful experiences</title>
  <desc id="desc">A dark editorial banner with lavender geometric shapes and the name Louis.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151419"/>
      <stop offset="1" stop-color="#211A31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7D8FF"/>
      <stop offset="1" stop-color="#A96FDB"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1065" cy="68" r="160" fill="#9A61C9" opacity="0.16" filter="url(#softGlow)"/>
  <circle cx="115" cy="320" r="130" fill="#7B5CE1" opacity="0.10" filter="url(#softGlow)"/>
  <g opacity="0.94">
    <rect x="882" y="68" width="70" height="70" rx="16" fill="#F4EEF8"/>
    <rect x="962" y="68" width="70" height="70" rx="16" fill="url(#accent)"/>
    <rect x="1042" y="68" width="70" height="70" rx="16" fill="#F4EEF8"/>
    <rect x="922" y="148" width="70" height="70" rx="16" fill="url(#accent)"/>
    <rect x="1002" y="148" width="70" height="70" rx="16" fill="#F4EEF8"/>
    <rect x="962" y="228" width="70" height="70" rx="16" fill="url(#accent)"/>
  </g>
  <text x="74" y="92" fill="#BDA1E5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="5">INDEPENDENT MAKER</text>
  <text x="68" y="206" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="100" font-weight="750" letter-spacing="-5">Louis.</text>
  <rect x="72" y="248" width="548" height="1" fill="#FFFFFF" opacity="0.18"/>
  <text x="72" y="291" fill="#D8D4DD" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="500" letter-spacing="2">MOBILE PRODUCTS  ·  THOUGHTFUL EXPERIENCES</text>
</svg>
